name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # The admin overview reads from Mongo; the e2e suite needs one to talk to
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      ADMIN_TOKEN: e2e-admin-token
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Changelog/sitemap dates come from git history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
