name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # Changelog/sitemap dates come from git history
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shipped dependencies must never carry a high/critical advisory.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      # braces <=3.0.3 is a dev-only transitive of eslint-config-next. 3.0.4,
      # the first patched release, is not published yet. The single exception
      # lives in pnpm-workspace.yaml; every other advisory still fails.
      - name: Audit all dependencies
        run: pnpm audit --audit-level high
      # M66: no secrets in the tree — the scanner runs before anything else
      - run: pnpm scan:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      # Coverage gates the shared logic; e2e coverage would only slow the suite.
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # The admin overview and the e2e suite need a real Mongo.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      ADMIN_TOKEN: e2e-admin-token
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
      LOGIN_ALERT_THRESHOLD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # I5: every hot query must use an index, and the built server must stay
      # quick under a light parallel load — both against the same Mongo service.
      - name: Index audit
        run: node scripts/audit-indexes.mjs
      - name: Light load check
        run: |
          set -euo pipefail
          pnpm start > /tmp/kotree-server.log 2>&1 &
          SERVER=$!
          cleanup() {
            kill "$SERVER" 2>/dev/null || true
            # next start is a child of pnpm; free the port even if pnpm exits
            # without forwarding the signal.
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
            else
              pkill -f 'next-server' 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          node scripts/load-check.mjs http://127.0.0.1:3000 40
      - name: Free port 3000 before Playwright
        if: always()
        run: |
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp 2>/dev/null || true
          else
            pkill -f 'next-server' 2>/dev/null || true
          fi
          sleep 1
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - name: Free port 3000 before the perf run
        if: always()
        run: |
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp 2>/dev/null || true
          else
            pkill -f 'next-server' 2>/dev/null || true
          fi
          sleep 1
      # M1: the perf budget runs alone, after the main suite, so nothing else
      # hogs the CPU while it measures
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Pixel baselines are win32-only. Running this on Linux would compare
  # different font rasterisation, so the platform gets its own job.
  visual:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ADMIN_TOKEN: e2e-admin-token
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install chromium
      - name: Free port 3000 before Playwright
        if: always()
        shell: bash
        run: |
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp 2>/dev/null || true
          else
            pkill -f 'next-server' 2>/dev/null || true
          fi
          sleep 1
      - run: npx playwright test e2e/visual.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7
